[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolab"
version = "0.1.0"
description = "Autonomous AI lab for materials discovery, built on Meta models (battery materials first)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pymatgen",
    "mp-api",
    "ase",
    "python-dotenv",
    "openai",
]

[project.optional-dependencies]
gpu = ["fairchem-core"]
web = ["fastapi", "uvicorn", "httpx", "websockets"]  # the interface and the local demo (scripts/dev_server.py)
research = ["modal"]  # new researches from the demo: UMA and DFT on your Modal account
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["autolab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs an NVIDIA GPU and UMA (run on Colab/Modal with --gpu)",
    "api: makes real paid LLM calls (run only on explicit request with --api)",
]
filterwarnings = [
    "ignore:logm result may be inaccurate",
    "ignore:Failed to guess oxidation states",
    "ignore:Support for class-based `config` is deprecated",
]
