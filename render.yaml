services:
  - type: web
    name: autolab-web
    runtime: python
    plan: free
    region: virginia            # next to the AutoLab service on Modal (us-east)
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set by the owner in the Render dashboard: address of the AutoLab service on Modal (not a secret, no key here).
      - key: AUTOLAB_API_URL
        sync: false
